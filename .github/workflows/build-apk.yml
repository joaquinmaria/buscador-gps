name: Build RutaFinder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle*','**/*.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and components
        uses: android-actions/setup-android@v3
        with:
          api-levels: '34'
          build-tools: '34.0.0'
          components: |
            cmdline-tools;latest
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Accept Android SDK licenses and update sdkmanager
        shell: bash
        run: |
          set -euo pipefail

          # Determine SDK root (prefer ANDROID_SDK_ROOT, fallback to ANDROID_HOME, then default)
          SDKROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          echo "Using SDK root: $SDKROOT"

          # Prefer cmdline-tools/latest; otherwise find first sdkmanager on disk
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER, searching for any sdkmanager under $SDKROOT..."
            SDKMANAGER="$(find "$SDKROOT" -type f -name sdkmanager 2>/dev/null | head -n1 || true)"
          fi

          echo "Using sdkmanager: ${SDKMANAGER:-<not found>}"

          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            # Print version for debugging
            "$SDKMANAGER" --version || true

            # Non-interactively accept licenses and update sdkmanager against the explicit SDK root
            yes | "$SDKMANAGER" --sdk_root="$SDKROOT" --licenses || true
            yes | "$SDKMANAGER" --sdk_root="$SDKROOT" --update || true

            # Optional: install legacy 'tools' package if some component still requires it (uncomment if needed)
            # yes | "$SDKMANAGER" --sdk_root="$SDKROOT" "tools" || true

          else
            echo "sdkmanager not found under ANDROID SDK root; listing $SDKROOT for debugging:"
            ls -la "$SDKROOT" || true
            exit 1
          fi

      - name: Build debug APK
        working-directory: ./RutaFinder
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RutaFinder-debug-apk
          path: RutaFinder/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
